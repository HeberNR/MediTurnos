version: '3.8'

services:
  db:
    image: mysql:8.0.33
    container_name: mysql-turnos
    environment:
      MYSQL_ROOT_PASSWORD: 0404 # Pass local
      MYSQL_DATABASE: gestion_turnos # Nombre exacto de la BD
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: tomcat-turnos
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data: