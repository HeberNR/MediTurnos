services:
  db:
    image: mysql:8.0.33
    container_name: mysql-turnos
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "0404"
      MYSQL_DATABASE: gestion_turnos
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "0404"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/main/resources:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p0404"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tomcat-turnos
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: