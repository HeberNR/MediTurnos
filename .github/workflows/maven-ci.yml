name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p0404 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gestion_turnos
      DB_USER: ci_user
      DB_PASSWORD: ci_password_123

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client netcat-openbsd

      - name: Debug inicial
        run: |
          echo "===== Variables ====="
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DB_NAME=$DB_NAME"

          echo ""
          echo "===== SQL encontrados ====="
          find . -name "*.sql"

          echo ""
          echo "===== Docker ====="
          docker ps -a || true

      - name: Esperar MySQL
        run: |
          echo "Esperando a que MySQL abra el puerto..."

          for i in {1..60}; do
            if nc -z $DB_HOST $DB_PORT; then
              echo "Puerto abierto."
              exit 0
            fi

            echo "Intento $i/60..."
            sleep 2
          done

          echo "MySQL nunca abrió el puerto."

          echo ""
          echo "===== Docker ====="
          docker ps -a || true

          echo ""
          echo "===== Logs MySQL ====="
          CONTAINER=$(docker ps -aq --filter ancestor=mysql:8.0.33)

          if [ -n "$CONTAINER" ]; then
            docker logs "$CONTAINER" || true
          fi

          exit 1

      - name: Preparar Base de Datos
        run: |
          set -e

          ROOT_USER=root
          ROOT_PASS=0404

          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n1)
          DATA_FILE=$(find . -name "*data.sql" | head -n1)

          echo "Schema encontrado: $SCHEMA_FILE"
          echo "Data encontrada: $DATA_FILE"

          if [ -z "$SCHEMA_FILE" ]; then
            echo "No se encontró schema.sql"
            exit 1
          fi

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$ROOT_USER" \
            -p"$ROOT_PASS" \
            -e "
              CREATE DATABASE IF NOT EXISTS ${DB_NAME};
              CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON ${DB_NAME}.* TO '${DB_USER}'@'%';
              FLUSH PRIVILEGES;
            "

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$DB_USER" \
            -p"$DB_PASSWORD" \
            "$DB_NAME" < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            mysql \
              -h"$DB_HOST" \
              -P"$DB_PORT" \
              -u"$DB_USER" \
              -p"$DB_PASSWORD" \
              "$DB_NAME" < "$DATA_FILE"
          fi

      - name: Ejecutar Tests
        run: mvn clean test

      - name: Empaquetar proyecto
        run: mvn package -DskipTests