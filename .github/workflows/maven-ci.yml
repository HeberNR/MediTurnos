name: Integración Continua (CI)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uci_user -pci_password_123 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gestion_turnos
      DB_USER: ci_user
      DB_PASSWORD: ci_password_123

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Esperar MySQL
        run: |
          echo "Esperando MySQL..."

          for i in {1..60}; do
            if mysql \
              -h"$DB_HOST" \
              -P"$DB_PORT" \
              -u"$DB_USER" \
              -p"$DB_PASSWORD" \
              -e "SELECT 1;" >/dev/null 2>&1; then

              echo "MySQL listo."
              exit 0
            fi

            echo "Intento $i/60..."
            sleep 2
          done

          echo "MySQL no respondió."
          exit 1

      - name: Importar Base de Datos
        run: |
          set -e

          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n1)
          DATA_FILE=$(find . -name "*data.sql" | head -n1)

          echo "Schema: $SCHEMA_FILE"
          echo "Data: $DATA_FILE"

          test -f "$SCHEMA_FILE"

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$DB_USER" \
            -p"$DB_PASSWORD" \
            "$DB_NAME" < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            mysql \
              -h"$DB_HOST" \
              -P"$DB_PORT" \
              -u"$DB_USER" \
              -p"$DB_PASSWORD" \
              "$DB_NAME" < "$DATA_FILE"
          fi

      - name: Ejecutar tests
        run: mvn clean test

      - name: Empaquetar
        run: mvn package -DskipTests