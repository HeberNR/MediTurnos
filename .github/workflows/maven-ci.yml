name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gestion_turnos
      DB_USER: root
      DB_PASSWORD: 0404

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar cliente de MySQL
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Espera robusta a que MySQL acepte conexiones reales
        run: |
          echo "Esperando a que MySQL esté completamente inicializado..."
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -P 3306 -uroot -p"0404" -e "SELECT 1" >/dev/null 2>&1; then
              echo "¡MySQL está listo y respondiendo!"
              break
            fi
            echo "Intento $i/60: MySQL todavía se está configurando internamente..."
            sleep 3
          done
          
          # Verificación final por si agotó los intentos
          if ! mysql -h 127.0.0.1 -P 3306 -uroot -p"0404" -e "SELECT 1" >/dev/null 2>&1; then
            echo "Error: MySQL no respondió a tiempo."
            exit 1
          fi

      - name: Inicializar tablas en MySQL de forma segura
        run: |
          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n 1)
          DATA_FILE=$(find . -name "*data.sql" | head -n 1)

          if [ -z "$SCHEMA_FILE" ]; then
            echo "Error: No se encontró ningún archivo schema.sql"
            exit 1
          fi

          echo "Asegurando permisos remotos para root..."
          mysql -h 127.0.0.1 -P 3306 -uroot -p"0404" -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY '0404'; GRANT ALL PRIVILEGES ON gestion_turnos.* TO 'root'@'%'; FLUSH PRIVILEGES;"

          echo "Cargando schema desde: $SCHEMA_FILE"
          mysql -h 127.0.0.1 -P 3306 -uroot -p"0404" gestion_turnos < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            echo "Cargando data desde: $DATA_FILE"
            mysql -h 127.0.0.1 -P 3306 -uroot -p"0404" gestion_turnos < "$DATA_FILE"
          fi

      - name: Compilar y Ejecutar Tests
        run: mvn clean test

      - name: Empaquetar el proyecto
        run: mvn package -DskipTests