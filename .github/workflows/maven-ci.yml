name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    # Variables de entorno para la aplicación y los tests (usando el usuario CI dedicado)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gestion_turnos
      DB_USER: ci_user
      DB_PASSWORD: ci_password_123

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar cliente de MySQL
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: "Esperar a que MySQL esté listo (host: mysql)"
        run: |
          for i in {1..90}; do
            if mysql -hmysql -P3306 -uroot -p"0404" -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL está listo"
              break
            fi
            echo "Intento $i/90: MySQL todavía se está configurando internamente..."
            sleep 2
          done

          if ! mysql -hmysql -P3306 -uroot -p"0404" -e "SELECT 1" >/dev/null 2>&1; then
            echo "Error: MySQL no respondió a tiempo."
            echo "== Estado mysql.user y versión =="
            mysql -hmysql -P3306 -uroot -p"0404" -e "SELECT USER(), CURRENT_USER(), @@version; SELECT User, Host, plugin FROM mysql.user;"
            exit 1
          fi

      - name: Inicializar y preparar MySQL (crear usuario CI e importar schema/data)
        run: |
          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n 1)
          DATA_FILE=$(find . -name "*data.sql" | head -n 1)

          if [ -z "$SCHEMA_FILE" ]; then
            echo "Error: No se encontró schema.sql"
            exit 1
          fi

          CI_USER="ci_user"
          CI_PASS="ci_password_123"

          echo "Creando usuario CI '$CI_USER'@'%' y asignando permisos..."
          mysql -hmysql -P3306 -uroot -p"0404" -e "
          CREATE USER IF NOT EXISTS '${CI_USER}'@'%' IDENTIFIED BY '${CI_PASS}';
          GRANT ALL PRIVILEGES ON gestion_turnos.* TO '${CI_USER}'@'%';
          FLUSH PRIVILEGES;"

          echo "Cargando schema desde: $SCHEMA_FILE"
          mysql -hmysql -P3306 -u"${CI_USER}" -p"${CI_PASS}" gestion_turnos < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            echo "Cargando data desde: $DATA_FILE"
            mysql -hmysql -P3306 -u"${CI_USER}" -p"${CI_PASS}" gestion_turnos < "$DATA_FILE"
          fi

      - name: Compilar y Ejecutar Tests
        run: mvn clean test

      - name: Empaquetar el proyecto
        run: mvn package -DskipTests