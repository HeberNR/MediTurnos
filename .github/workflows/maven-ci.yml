name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      DB_NAME: gestion_turnos
      DB_USER: ci_user
      DB_PASSWORD: ci_password_123

    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client netcat-openbsd

      - name: Ver estado de Docker
        run: |
          docker ps -a
          docker logs $(docker ps -aq --filter ancestor=mysql:8.0.33) || true    

      - name: Debug inicial
        run: |
          echo "HOST=$DB_HOST"
          echo "PORT=$DB_PORT"

          echo "===== SQL encontrados ====="
          find . -name "*.sql"

          echo "===== Esperando puerto ====="
          for i in {1..30}; do
            nc -z "$DB_HOST" "$DB_PORT" && break
            echo "Esperando puerto..."
            sleep 2
          done

      - name: Preparar Base de Datos
        run: |
          set -e

          ROOT_USER=root
          ROOT_PASS=0404

          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n 1)
          DATA_FILE=$(find . -name "*data.sql" | head -n 1)

          echo "Schema: $SCHEMA_FILE"
          echo "Data: $DATA_FILE"

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$ROOT_USER" \
            -p"$ROOT_PASS" \
            -e "SELECT VERSION();"

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$ROOT_USER" \
            -p"$ROOT_PASS" \
            -e "
              CREATE DATABASE IF NOT EXISTS ${DB_NAME};
              CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON ${DB_NAME}.* TO '${DB_USER}'@'%';
              FLUSH PRIVILEGES;
            "

          mysql \
            -h"$DB_HOST" \
            -P"$DB_PORT" \
            -u"$DB_USER" \
            -p"$DB_PASSWORD" \
            "$DB_NAME" < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            mysql \
              -h"$DB_HOST" \
              -P"$DB_PORT" \
              -u"$DB_USER" \
              -p"$DB_PASSWORD" \
              "$DB_NAME" < "$DATA_FILE"
          fi

      - name: Ejecutar Tests
        run: mvn clean test

      - name: Empaquetar
        run: mvn package -DskipTests