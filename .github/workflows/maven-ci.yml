name: Integración Continua (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: 0404
          MYSQL_DATABASE: gestion_turnos
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gestion_turnos
      DB_USER: ci_user
      DB_PASSWORD: ci_password_123

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar cliente de MySQL
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: "Esperar y preparar MySQL (multi-host, usuario CI e importación)"
        run: |
          set -euo pipefail

          DB_HOST_CANDIDATES=("mysql" "127.0.0.1")
          DB_PORT="${DB_PORT:-3306}"
          ROOT_USER="root"
          ROOT_PASS="0404"
          DB_NAME="${DB_NAME:-gestion_turnos}"

          SCHEMA_FILE=$(find . -name "*schema.sql" | head -n 1 || true)
          DATA_FILE=$(find . -name "*data.sql" | head -n 1 || true)

          if [ -z "$SCHEMA_FILE" ]; then
            echo "Error: No se encontró ningun archivo schema.sql"
            exit 1
          fi

          MAX_ATTEMPTS=90
          SLEEP_SECONDS=2
          CONNECTED_HOST=""

          echo "Buscando conexión con MySQL..."
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            for host in "${DB_HOST_CANDIDATES[@]}"; do
              if mysql -h"$host" -P"$DB_PORT" -u"$ROOT_USER" -p"$ROOT_PASS" -e "SELECT 1" >/dev/null 2>&1; then
                CONNECTED_HOST="$host"
                echo "¡Conectado exitosamente a MySQL usando host='$host' en el intento $attempt!"
                break 2
              fi
            done
            echo "Intento $attempt/$MAX_ATTEMPTS: Esperando a que MySQL responda..."
            sleep $SLEEP_SECONDS
          done

          if [ -z "$CONNECTED_HOST" ]; then
            echo "Error: MySQL no respondió a tiempo en ninguno de los hosts."
            exit 1
          fi

          CI_USER="ci_user"
          CI_PASS="ci_password_123"

          echo "Creando base de datos y usuario CI '${CI_USER}'@'%'..."
          mysql -h"$CONNECTED_HOST" -P"$DB_PORT" -u"$ROOT_USER" -p"$ROOT_PASS" -e "
          CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`;
          CREATE USER IF NOT EXISTS '${CI_USER}'@'%' IDENTIFIED BY '${CI_PASS}';
          GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${CI_USER}'@'%';
          FLUSH PRIVILEGES;"

          echo "Importando schema desde: $SCHEMA_FILE"
          mysql -h"$CONNECTED_HOST" -P"$DB_PORT" -u"$CI_USER" -p"$CI_PASS" "$DB_NAME" < "$SCHEMA_FILE"

          if [ -n "$DATA_FILE" ]; then
            echo "Importando data desde: $DATA_FILE"
            mysql -h"$CONNECTED_HOST" -P"$DB_PORT" -u"$CI_USER" -p"$CI_PASS" "$DB_NAME" < "$DATA_FILE"
          fi

      - name: Compilar y Ejecutar Tests
        run: mvn clean test

      - name: Empaquetar el proyecto
        run: mvn package -DskipTests